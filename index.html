<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市生命线 · 燃气监管 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0a1628 0%, #13294b 50%, #1a3a5c 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: #e8f4ff;
  }
  .container {
    max-width: 900px;
    width: 100%;
  }
  .header {
    text-align: center;
    margin-bottom: 50px;
  }
  .header h1 {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(90deg, #4fc3f7, #81d4fa, #b3e5fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .header p {
    font-size: 15px;
    color: #7ea8c9;
    letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 24px;
  }
  .card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(79, 195, 247, 0.2);
    border-radius: 16px;
    padding: 32px;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #4fc3f7, #29b6f6);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(79, 195, 247, 0.5);
    box-shadow: 0 12px 40px rgba(79, 195, 247, 0.15);
  }
  .card:hover::before { transform: scaleX(1); }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 18px;
  }
  .card:nth-child(1) .icon {
    background: linear-gradient(135deg, rgba(79, 195, 247, 0.2), rgba(41, 182, 246, 0.1));
  }
  .card:nth-child(2) .icon {
    background: linear-gradient(135deg, rgba(255, 152, 0, 0.2), rgba(255, 183, 77, 0.1));
  }
  .card h2 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #fff;
  }
  .card p {
    font-size: 14px;
    line-height: 1.7;
    color: #8fb8d4;
    margin-bottom: 16px;
  }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(79, 195, 247, 0.12);
    color: #4fc3f7;
    border: 1px solid rgba(79, 195, 247, 0.2);
  }
  .card:nth-child(2) .tag {
    background: rgba(255, 152, 0, 0.12);
    color: #ffb74d;
    border-color: rgba(255, 152, 0, 0.2);
  }
  .footer {
    text-align: center;
    margin-top: 50px;
    font-size: 13px;
    color: #5a7a96;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>城市生命线 · 燃气监管 Demo</h1>
      <p>智慧燃气智能表 3D 演示 &nbsp;·&nbsp; 智慧燃气监管驾驶舱</p>
    </div>
    <div class="grid">
      <a href="smart-meter/index.html" class="card">
        <div class="icon">🔥</div>
        <h2>智能燃气表 3D 动态演示</h2>
        <p>基于 Three.js 的智能燃气表三维拆解动画，展示内部部件结构、异常工况（欠压/超压/流量超限/微小泄漏）及球阀自主切断原理。</p>
        <span class="tag">Three.js · 3D 拆解</span>
      </a>
      <a href="cockpit/index.html" class="card">
        <div class="icon">📊</div>
        <h2>智慧燃气监管驾驶舱</h2>
        <p>燃气安全监管可视化大屏，涵盖基础信息、实时监测、风险预警、隐患排查、应急指挥、泄漏分析等多维度监管模块。</p>
        <span class="tag">大屏可视化 · 监管驾驶舱</span>
      </a>
    </div>
    <div class="footer">
      © 2026 城市生命线 · 燃气监管 Demo
    </div>
  </div>
</body>
</html>

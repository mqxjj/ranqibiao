<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>投诉处置 - 某某智慧燃气监管</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.src-filter{display:flex;gap:6px;flex-wrap:wrap}
.src-filter button{padding:4px 10px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--sub);font-size:12px;cursor:pointer;font-family:var(--sans);transition:.2s}
.src-filter button:hover{color:var(--text)}
.src-filter button.on{color:var(--accent3);border-color:var(--accent);background:rgba(34,211,238,.12)}
.proc-flow{display:flex;align-items:stretch;gap:0;padding:8px 0;overflow-x:auto}
.proc-step{flex:1;min-width:110px;text-align:center;padding:12px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);position:relative;cursor:pointer;transition:.2s}
.proc-step:hover{border-color:var(--accent);box-shadow:0 0 10px rgba(34,211,238,.18)}
.proc-step .pi{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#04122A;margin:0 auto 6px}
.proc-step .pi svg{width:15px;height:15px}
.proc-step .pn{font-size:11px;color:var(--accent3);font-family:var(--mono)}
.proc-step .pt{font-size:13px;color:var(--text);margin-top:4px;font-weight:600}
.proc-step .pd{font-size:10px;color:var(--sub);margin-top:2px}
.proc-arrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--accent);opacity:.5}
.ent-row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px dashed rgba(34,211,238,.08);font-size:12px}
.ent-row .en{flex:1;color:var(--text)}
.cat-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px dashed rgba(34,211,238,.06)}
.cat-item .cn{flex:1;color:var(--sub)}
.cat-item .cv{font-family:var(--mono);color:var(--accent3);font-weight:600}
</style>
</head>
<body data-page="complaint">
<div class="bg-atmos"></div>
<header class="topbar"><span class="back" onclick="location.href='index.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg> 返回驾驶舱</span><div class="brand"><svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="26" height="26"><path d="M12 2c-3 4-6 7-6 11a6 6 0 0012 0c0-4-3-7-6-11z"/><path d="M12 18v3M9 21h6"/></svg> 智慧燃气监管</div><div class="crumb">监管应用 / <b>投诉处置</b></div><div class="sp"></div><div class="rt"><span class="stat"><span class="dot ok"></span>系统正常</span><span class="clk">--</span><span>值守：住建局</span></div></header>
<aside class="sidenav" id="nav"></aside>
<main class="main">
<!-- KPI -->
<div class="grid g-3" style="margin-bottom:14px">
  <div class="kpi" data-r="0">
    <div class="glow"></div>
    <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14"><path d="M21 11.5a8.5 8.5 0 01-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1121 11.5z"/></svg> 投诉总数</div>
    <div class="val" id="kpiTotal">0<span class="u">件</span></div>
    <div class="trend up">▲ 本期累计</div>
  </div>
  <div class="kpi" data-r="60">
    <div class="glow"></div>
    <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14"><path d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 已办结</div>
    <div class="val" id="kpiDone">0<span class="u">件</span></div>
    <div class="trend up">▲ 办结率 93.7%</div>
  </div>
  <div class="kpi" data-r="120">
    <div class="glow"></div>
    <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="14" height="14"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg> 办结率</div>
    <div class="val" id="kpiRate">0<span class="u">%</span></div>
    <div class="trend up">▲ 同比 +2.1%</div>
  </div>
</div>

<div class="grid" style="grid-template-columns:1fr 380px">
  <!-- 左：投诉列表 -->
  <div class="panel flex-1" data-r="40">
    <div class="panel-h"><span class="t">投诉上报列表</span><span class="more">实时受理</span></div>
    <div class="panel-b">
      <div class="toolbar">
        <div class="src-filter" id="srcFilter">
          <button class="on" data-src="all">全部</button>
          <button data-src="12345热线">12345热线</button>
          <button data-src="微信小程序">微信小程序</button>
          <button data-src="来电">来电</button>
        </div>
        <span class="sp"></span>
        <div class="src-filter" id="stateFilter">
          <button class="on" data-state="all">全部</button>
          <button data-state="办理中">办理中</button>
          <button data-state="已办结">已办结</button>
        </div>
      </div>
      <table class="tbl">
        <thead><tr><th>投诉ID</th><th>来源</th><th>投诉人</th><th>投诉事项</th><th>转办</th><th>办理情况</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="compBody"></tbody>
      </table>
    </div>
  </div>
  <!-- 右：统计 -->
  <div class="fcol gap12">
    <!-- 办结率环形 + 来源柱状 -->
    <div class="panel" data-r="100">
      <div class="panel-h"><span class="t">办结率</span></div>
      <div class="panel-b flex aic gap12">
        <div class="donut" style="width:100px;height:100px;flex:0 0 100px">
          <canvas id="doneDonut" style="width:100px;height:100px"></canvas>
          <div class="cap"><div class="v" id="doneRate">0%</div><div class="l">办结率</div></div>
        </div>
        <div style="flex:1">
          <div class="flex jcb fz12"><span class="t-sub">已办结</span><span class="mono t-ok" id="dDone">0</span></div>
          <div class="flex jcb fz12 mt8"><span class="t-sub">办理中</span><span class="mono t-warn" id="dPending">0</span></div>
          <div class="flex jcb fz12 mt8"><span class="t-sub">平均处置</span><span class="mono t-accent">2.3 天</span></div>
        </div>
      </div>
    </div>
    <!-- 来源分布 -->
    <div class="panel" data-r="160">
      <div class="panel-h"><span class="t">投诉来源分布</span></div>
      <div class="panel-b">
        <canvas id="srcChart" style="width:100%;height:110px"></canvas>
        <div class="mt8" id="srcLegend"></div>
      </div>
    </div>
    <!-- 分类统计 -->
    <div class="panel" data-r="220">
      <div class="panel-h"><span class="t">投诉分类统计</span></div>
      <div class="panel-b" id="catList"></div>
    </div>
  </div>
</div>

<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
  <!-- 转办情况 -->
  <div class="panel" data-r="280">
    <div class="panel-h"><span class="t">转办情况 · 按企业</span></div>
    <div class="panel-b" id="transList"></div>
  </div>
  <!-- 办结趋势 -->
  <div class="panel" data-r="300">
    <div class="panel-h"><span class="t">办结趋势 · 近7日</span></div>
    <div class="panel-b"><canvas id="trendChart" style="width:100%;height:120px"></canvas></div>
  </div>
</div>

<!-- 办理流程 -->
<div class="panel mt12" data-r="340">
  <div class="panel-h"><span class="t">投诉办理流程</span><span class="more">闭环管理</span></div>
  <div class="panel-b">
    <div class="proc-flow" id="procFlow"></div>
  </div>
</div>
</main>
<script src="mock.js"></script>
<script src="shell.js"></script>
<script src="map.js"></script>
<script>
/* ====== KPI ====== */
const cs=DB.complaintStat;
document.getElementById('kpiTotal').innerHTML=fmt(cs.total)+'<span class="u">件</span>';
document.getElementById('kpiDone').innerHTML=fmt(cs.done)+'<span class="u">件</span>';
document.getElementById('kpiRate').innerHTML=cs.rate+'<span class="u">%</span>';
document.getElementById('doneRate').textContent=cs.rate+'%';
document.getElementById('dDone').textContent=fmt(cs.done);
document.getElementById('dPending').textContent=fmt(cs.total-cs.done);
donut(document.getElementById('doneDonut'),[{v:cs.rate,color:'#22D3EE'},{v:100-cs.rate,color:'rgba(124,58,237,.2)'}]);

/* ====== 来源分布 ====== */
const srcMap={};
DB.complaints.forEach(c=>srcMap[c.src]=(srcMap[c.src]||0)+1);
// 扩展为总量分布（演示）
const srcData=[{n:'12345热线',v:152},{n:'微信小程序',v:78},{n:'来电',v:56}];
barChart(document.getElementById('srcChart'),srcData.map(d=>d.v),srcData.map(d=>d.n),{color:'#22D3EE'});
document.getElementById('srcLegend').innerHTML=srcData.map(d=>`<div class="flex jcb fz12" style="margin-bottom:4px"><span class="t-sub">${d.n}</span><span class="mono t-accent">${d.v} 件</span></div>`).join('');

/* ====== 分类统计 ====== */
const cats=[{n:'疑似燃气味',v:62,c:'#FF4D5E'},{n:'表具异常',v:48,c:'#FBBF24'},{n:'气压不足',v:54,c:'#22D3EE'},{n:'施工破坏',v:38,c:'#7C3AED'},{n:'费用疑问',v:84,c:'#22C55E'}];
document.getElementById('catList').innerHTML=cats.map(c=>`
  <div class="cat-item"><span class="lvl ${c.n.includes('味')||c.n.includes('破坏')?'red':c.n.includes('气压')?'blu':c.n.includes('费用')?'yel':'yel'}"><i style="background:${c.c};box-shadow:0 0 6px ${c.c}"></i></span><span class="cn">${c.n}</span><span class="cv">${c.v}</span></div>`).join('');

/* ====== 转办情况 ====== */
const transMap={};
DB.complaints.forEach(c=>{if(!transMap[c.trans])transMap[c.trans]={t:0,d:0};transMap[c.trans].t++;if(c.state==='已办结')transMap[c.trans].d++;});
document.getElementById('transList').innerHTML=Object.entries(transMap).map(([k,v])=>`
  <div class="ent-row"><span class="en">${k}</span><span class="mono t-sub">${v.d}/${v.t}</span><div class="bar" style="width:80px"><i style="width:${Math.round(v.d/v.t*100)}%"></i></div><span class="mono fz12 ${v.d===v.t?'t-ok':'t-warn'}">${Math.round(v.d/v.t*100)}%</span></div>`).join('');

/* ====== 办结趋势 ====== */
lineChart(document.getElementById('trendChart'),[38,42,35,40,36,33,44],{color:'#22D3EE'});

/* ====== 办理流程 ====== */
const PROC=[
  {n:'01',t:'上报',d:'多渠道受理',icon:'M21 11.5a8.5 8.5 0 01-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1121 11.5z'},
  {n:'02',t:'分类',d:'按事项归类',icon:'M3 7h18M3 12h18M3 17h18'},
  {n:'03',t:'分派',d:'科室/企业',icon:'M5 12h14M13 6l6 6-6 6'},
  {n:'04',t:'处置',d:'限期办理',icon:'M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z'},
  {n:'05',t:'反馈',d:'回复投诉人',icon:'M3 12h4l3-9 4 18 3-9h4'},
  {n:'06',t:'归档',d:'闭环备查',icon:'M4 5h16M4 5v14a1 1 0 001 1h14a1 1 0 001-1V5M9 9h6'},
];
document.getElementById('procFlow').innerHTML=PROC.map((p,i)=>{
  const arr=i<PROC.length-1?'<div class="proc-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>':'';
  return `<div class="proc-step" onclick="openProcStep(${i})"><div class="pi">${svgIcon(p.icon,15,15)}</div><div class="pn">STEP ${p.n}</div><div class="pt">${p.t}</div><div class="pd">${p.d}</div></div>${arr}`;
}).join('');

/* ====== 投诉列表 ====== */
let curSrc='all',curState='all';
function renderComp(){
  let list=DB.complaints.filter(c=>(curSrc==='all'||c.src===curSrc)&&(curState==='all'||c.state===curState));
  document.getElementById('compBody').innerHTML=list.length?list.map(c=>`
    <tr>
      <td class="mono">${c.id}</td>
      <td><span class="tag info">${c.src}</span></td>
      <td>${c.person}</td>
      <td>${c.item}</td>
      <td class="t-sub fz12">${c.trans}</td>
      <td>${c.state==='已办结'?'<span class="tag ok">已办结</span>':'<span class="tag warn">办理中</span>'}</td>
      <td class="mono fz12">${c.time}</td>
      <td><button class="btn primary" onclick="openHandle('${c.id}')">办理</button></td>
    </tr>`).join(''):'<tr><td colspan="8"><div class="empty">无符合条件的投诉</div></td></tr>';
}
renderComp();
document.querySelectorAll('#srcFilter button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#srcFilter button').forEach(x=>x.classList.remove('on'));b.classList.add('on');curSrc=b.dataset.src;renderComp();};});
document.querySelectorAll('#stateFilter button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#stateFilter button').forEach(x=>x.classList.remove('on'));b.classList.add('on');curState=b.dataset.state;renderComp();};});

/* ====== 抽屉：办理 ====== */
function openHandle(id){
  const c=DB.complaints.find(x=>x.id===id);
  openDrawer('投诉办理 · '+c.id,`
    <div class="field"><div class="k">投诉ID</div><div class="v mono">${c.id}</div></div>
    <div class="field"><div class="k">来源</div><div class="v">${c.src}</div></div>
    <div class="field"><div class="k">投诉人</div><div class="v">${c.person}</div></div>
    <div class="field"><div class="k">投诉事项</div><div class="v">${c.item}</div></div>
    <div class="field"><div class="k">当前转办</div><div class="v">${c.trans}</div></div>
    <div class="field"><div class="k">当前状态</div><div class="v">${c.state==='已办结'?'<span class="tag ok">已办结</span>':'<span class="tag warn">办理中</span>'}</div></div>
    <div class="field"><div class="k">分派对象</div><div class="v"><select id="hAssign" style="width:100%;padding:6px;background:rgba(8,17,38,.8);border:1px solid var(--line);color:var(--text);border-radius:4px"><optgroup label="科室人员"><option>监管科-王建国</option><option>执法大队-李志远</option></optgroup><optgroup label="企业责任单位">${DB.enterprises.map(e=>`<option>${e.name}</option>`).join('')}</optgroup></select></div></div>
    <div class="field"><div class="k">办理意见</div><div class="v"><textarea style="width:100%;padding:6px;background:rgba(8,17,38,.8);border:1px solid var(--line);color:var(--text);border-radius:4px;min-height:60px" placeholder="请填写办理意见..."></textarea></div></div>
    <div class="field"><div class="k">定期反馈</div><div class="v t-sub fz12">办理后自动向投诉人推送反馈，并定期回访</div></div>
    <div class="df"><button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" onclick="closeDrawer()">提交办理</button></div>`);
}
function openProcStep(i){
  const p=PROC[i];
  openDrawer('流程节点 · '+p.t,`<div class="field"><div class="k">节点</div><div class="v">STEP ${p.n} · ${p.t}</div></div><div class="field"><div class="k">说明</div><div class="v">${p.d}</div></div><div class="field"><div class="k">办理时限</div><div class="v mono">${i<3?'1 小时':i<5?'3 个工作日':'1 个工作日'}</div></div><div class="df"><button class="btn primary" onclick="closeDrawer()">关闭</button></div>`);
}
</script>
</body>
</html>
